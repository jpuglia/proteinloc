[project]
name = "proteinloc"
version = "0.1.0"
description = "Predict protein subcellular localization using protein language model embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "bioinformatics",
    "protein",
    "subcellular-localization",
    "machine-learning",
    "esm",
    "prostt5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "biopython>=1.83",
    "huggingface-hub>=0.23.0",
    "joblib>=1.4.0",
    "scikit-learn==1.6.1",
    "numpy>=1.26.4",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "esm>=3.1.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[project.urls]
Homepage = "https://github.com/jpuglia/proteinloc"
Repository = "https://github.com/jpuglia/proteinloc"
"Bug Tracker" = "https://github.com/jpuglia/proteinloc/issues"
"HF Models" = "https://huggingface.co/jpuglia/proteinloc"
Changelog = "https://github.com/jpuglia/proteinloc/blob/main/CHANGELOG.md"

[project.scripts]
proteinloc = "proteinloc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinloc"]

[tool.hatch.build.targets.sdist]
include = [
    "src/proteinloc",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]